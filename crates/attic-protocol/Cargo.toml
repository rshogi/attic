[package]
name = "attic-protocol"
version.workspace = true
edition.workspace = true
publish = false

# Protocol layer: may import Search, Storage, and State, never Evaluation
# directly.
[dependencies]
attic-numa = { path = "../attic-numa" }
attic-search = { path = "../attic-search", default-features = false }
attic-state = { path = "../attic-state", default-features = false }
attic-storage = { path = "../attic-storage" }

# Pass-through only; see `attic-state/Cargo.toml`.
[features]
default = ["quick-draw"]
quick-draw = ["attic-search/quick-draw", "attic-state/quick-draw"]
sfnn_halfkahm2_1536_15_32_k3k3 = ["attic-search/sfnn_halfkahm2_1536_15_32_k3k3"]
sfnn_halfkahm2_1024_15_64_progress8kpabs = ["attic-search/sfnn_halfkahm2_1024_15_64_progress8kpabs"]
sfnn_halfkahm2_1024_15_64_progress8ek = ["attic-search/sfnn_halfkahm2_1024_15_64_progress8ek"]
sfnn_halfkahm2_2304_15_64_progress8ek = ["attic-search/sfnn_halfkahm2_2304_15_64_progress8ek"]
nnue_kp_256x2_32_32 = ["attic-search/nnue_kp_256x2_32_32"]
nnue_halfkp_256x2_32_32 = ["attic-search/nnue_halfkp_256x2_32_32"]
nnue_halfkp_128x2_32_32 = ["attic-search/nnue_halfkp_128x2_32_32"]
nnue_halfkp_768x2_16_64 = ["attic-search/nnue_halfkp_768x2_16_64"]
sym_kp_128x2_512 = ["attic-search/sym_kp_128x2_512"]
sym_halfkp_128x2_512 = ["attic-search/sym_halfkp_128x2_512"]
hce_material_17 = ["attic-search/hce_material_17", "hce"]
hce_mobility_107_57 = ["attic-search/hce_mobility_107_57", "hce"]
# Qualifies one of the two shapes above; it is not a shape of its own.
hce_fit_qsearched = ["attic-search/hce_fit_qsearched"]
# Internal: every hand-crafted shape turns it on. They read no `nn.bin`, so the
# tests that expect a missing one to fail the load are gated on it. A `cfg`
# cannot see another crate's features, hence one copy per crate.
hce = []
ref_check_time = ["attic-search/ref_check_time"]

[dev-dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
