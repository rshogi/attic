[package]
name = "attic-search"
version.workspace = true
edition.workspace = true
publish = false

# Search layer: may depend on Evaluation, Storage, and State, never on Protocol.
# It owns the transposition table, including widening and validating stored
# moves against a `Position`.
[dependencies]
attic-eval = { path = "../attic-eval", default-features = false }
attic-state = { path = "../attic-state", default-features = false }
attic-storage = { path = "../attic-storage" }

# Pass-through only; see `attic-state/Cargo.toml`. The search's own repetition
# handling is the `RepetitionState`-to-score mapping, identical either way.
[features]
default = ["quick-draw"]
quick-draw = ["attic-state/quick-draw", "attic-eval/quick-draw"]
# Network selection, passed through to attic-eval. Shapes that keep their
# layer-stack coefficients outside `nn.bin` also make the loader pick up the
# `progress.bin` beside it.
sfnn1536 = ["attic-eval/sfnn1536"]
halfka2304 = ["attic-eval/halfka2304"]

[dev-dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
