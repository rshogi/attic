[package]
name = "attic-rescore"
version.workspace = true
edition.workspace = true
publish = false

# Puts a fixed-depth MultiPV search score on every record of a PSV file, and
# walks a position to the leaf of its quiescence search. Drives the search
# in-process like `attic-gensfen`: one copy of the network per NUMA node, shared
# by that node's workers.
#
# `serde_json` and `sha2` keep the checkpoint and the receipts of a resumable
# part; `zstd` compresses the raw search output that is kept beside it.
[dependencies]
attic-eval = { path = "../attic-eval", default-features = false }
attic-search = { path = "../attic-search", default-features = false }
attic-state = { path = "../attic-state", default-features = false }
attic-storage = { path = "../attic-storage" }
attic-numa = { path = "../attic-numa" }
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
sha2 = "~0.10"
zstd = "~0.13"

[features]
default = ["quick-draw"]
quick-draw = [
    "attic-eval/quick-draw",
    "attic-search/quick-draw",
    "attic-state/quick-draw",
]

# Network selection, passed through like `attic-gensfen` does: exactly one
# shape must be chosen and `attic-eval` refuses to compile with none.
sfnn_halfkahm2_1536_15_32_k3k3 = ["attic-eval/sfnn_halfkahm2_1536_15_32_k3k3", "attic-search/sfnn_halfkahm2_1536_15_32_k3k3"]
sfnn_halfkahm2_1024_15_64_progress8kpabs = ["attic-eval/sfnn_halfkahm2_1024_15_64_progress8kpabs", "attic-search/sfnn_halfkahm2_1024_15_64_progress8kpabs"]
