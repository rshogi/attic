[package]
name = "attic"
version.workspace = true
edition.workspace = true
publish = false

# The `[[test]]` below is not auto-discovered: it lives one directory down.
[[test]]
name = "parity_perft"
path = "tests/parity/perft.rs"

[dependencies]
attic-protocol = { path = "../attic-protocol", default-features = false }
attic-state = { path = "../attic-state", default-features = false }

# Global allocator for the shipped binary only; every library crate stays
# allocator-agnostic. `secure` is left off: it costs throughput for hardening
# this engine has no threat model for. The reference build uses the system
# allocator, so this is a performance divergence with no semantic effect.
mimalloc = "0.1"

# Pass-through only; see `attic-state/Cargo.toml`. This crate builds the shipped
# binary, so its default is what a release gets.
[features]
default = ["quick-draw"]
quick-draw = ["attic-protocol/quick-draw", "attic-state/quick-draw"]
# Network selection; exactly one is required. See attic-eval's features.
sfnn_halfkahm2_1536_15_32_k3k3 = ["attic-protocol/sfnn_halfkahm2_1536_15_32_k3k3"]
sfnn_halfkahm2_1024_15_64_progress8kpabs = ["attic-protocol/sfnn_halfkahm2_1024_15_64_progress8kpabs"]
sfnn_halfkahm2_2304_15_64_progress8ek = ["attic-protocol/sfnn_halfkahm2_2304_15_64_progress8ek"]
nnue_kp_256x2_32_32 = ["attic-protocol/nnue_kp_256x2_32_32"]
nnue_halfkp_256x2_32_32 = ["attic-protocol/nnue_halfkp_256x2_32_32"]
nnue_halfkp_128x2_32_32 = ["attic-protocol/nnue_halfkp_128x2_32_32"]
nnue_halfkp_768x2_16_64 = ["attic-protocol/nnue_halfkp_768x2_16_64"]
sym_kp_128x2_512 = ["attic-protocol/sym_kp_128x2_512"]
sym_halfkp_128x2_512 = ["attic-protocol/sym_halfkp_128x2_512"]
hce_material_17 = ["attic-protocol/hce_material_17", "hce"]
hce_mobility_107_57 = ["attic-protocol/hce_mobility_107_57", "hce"]
# Qualifies one of the two shapes above; it is not a shape of its own.
hce_fit_qsearched = ["attic-protocol/hce_fit_qsearched"]
# Internal: every hand-crafted shape turns it on. They read no `nn.bin`, so the
# tests that expect a missing one to fail the load are gated on it. A `cfg`
# cannot see another crate's features, hence one copy per crate.
hce = []
ref_check_time = ["attic-protocol/ref_check_time"]

[dev-dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
