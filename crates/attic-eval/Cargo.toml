[package]
name = "attic-eval"
version.workspace = true
edition.workspace = true
publish = false

# Evaluation layer: may import State and Storage, never Protocol or Search.
[dependencies]
attic-state = { path = "../attic-state", default-features = false }
attic-storage = { path = "../attic-storage" }

# Pass-through of `attic-state/quick-draw`. Cargo unifies features per crate, so
# every path dependency on `attic-state` has to opt out of default features and
# re-export the switch, or `--no-default-features` on one member would be
# silently overridden by another.
[features]
default = ["quick-draw"]
quick-draw = ["attic-state/quick-draw"]
# Exactly one network shape must be selected; there is no default. The kernels
# use the dimensions as array lengths, so the choice is a build-time one.
#
# SFNN shapes: HalfKA_hm2, the two perspectives multiplied element-wise, nine
# layer stacks in the file. The name ends with the rule that picks a stack for a
# position. `k3k3` is the two kings' ranks. `progress8ek` and `progress8kpabs`
# are game progress cut into eight buckets (the coefficients are in a
# `progress.bin` beside `nn.bin`), and they differ in one thing: `ek` sends
# mutual entering kings to the ninth stack, `kpabs` has no such case.
#
# The two 1024 shapes read the same file layout and differ in that rule alone. The
# file does not say which one it was trained for (a net trained with the ninth
# stack and one trained without carry the same header), so the build does.
sfnn_halfkahm2_1536_15_32_k3k3 = ["sfnn"]
sfnn_halfkahm2_1024_15_64_progress8kpabs = ["sfnn_progress"]
sfnn_halfkahm2_1024_15_64_progress8ek = ["sfnn_progress_ek"]
sfnn_halfkahm2_2304_15_64_progress8ek = ["sfnn_progress_ek"]
# YaneuraOu's standard shapes. One dense stack, no bucketing, and the
# perspectives concatenated rather than multiplied — see `NetDims::KP256`. The
# name spells the architecture the way YaneuraOu does: feature set, transformer
# width by two perspectives, then the two hidden widths.
nnue_kp_256x2_32_32 = ["nnue_standard"]
nnue_halfkp_256x2_32_32 = ["nnue_standard", "nnue_halfkp"]
nnue_halfkp_128x2_32_32 = ["nnue_standard", "nnue_halfkp"]
nnue_halfkp_768x2_16_64 = ["nnue_standard", "nnue_halfkp"]
# Internal. Each shape turns on the ones that describe it so that the code they
# share can be gated once instead of listing every shape. None selects a network
# by itself: the guard in `types.rs` only counts the shapes above.
#   sfnn                 every SFNN shape
#   sfnn_progress        ... whose stack is picked by game progress
#   sfnn_progress_ek     ... and which also sends mutual entering kings to the ninth
#                        stack (NAGISA V4, and the 1024 net tatara trains with the
#                        entering-king bucket). Without it the ninth is read and
#                        never used, because V3 was trained with eight buckets.
#   nnue_standard        every YaneuraOu standard shape
#   nnue_halfkp          ... whose features are `HalfKP` (the other is K+P)
#   sym                  every Manaka shape. Like `hce` it stands for them in the
#                        guard's pairwise lists, so a new one widens none of them
#   sym_kp               ... whose features are K+P
#   sym_halfkp           ... whose features are Manaka's HalfKP
#   sym_token            ... whose features are Manaka's own token space (2,344 rows,
#                        nothing crossed with anything). The only space a pair
#                        table, a second moment or a square field can exist in
#   hce                  every hand-crafted shape. Unlike the others it also
#                        stands for them in the guard's pairwise lists, because
#                        an HCE shape is exactly what `hce` being on means.
sfnn = []
sfnn_progress = ["sfnn"]
sfnn_progress_ek = ["sfnn_progress"]
nnue_standard = []
nnue_halfkp = []
sym = []
sym_kp = ["sym"]
sym_halfkp = ["sym"]
sym_token = ["sym"]
hce = []
# Manaka's own shapes, spelled the way YaneuraOu spells its architectures:
# feature space, transformer width by two perspectives, then the dense widths.
# `SYM` is the prefix Manaka's `network_type` already uses. They read the
# `nn.bin` container with `ModelType=SYMscaled` in the architecture string (or
# `SYMf32`, or the first encoding, `SYM`): an RMS norm where NNUE clips, and a
# tanh on the value. They share this crate's feature extraction and nothing
# else, see `src/manaka/`.
#
# `token` is Manaka's own space and the one the trainer starts from: the other two
# borrow YaneuraOu's numbering so that the two engines' feature sets agree.
#
# The name carries the power-sum order only when it is not three: `_o1_` is the
# first power alone, with nothing for Newton's identities to do. Without it the
# order is three. A second dense width follows the first, as in NNUE's names.
#
#   feature                    Manaka's shape code
#   sym_kp_64x2_512            kp_pair0_d64_o3_h512
#   sym_halfkp_64x2_512        halfkp_pair0_d64_o3_h512
#   sym_kp_128x2_512           kp_pair0_d128_o3_h512
#   sym_halfkp_128x2_512       halfkp_pair0_d128_o3_h512
#   sym_kp_256x2_512           kp_pair0_d256_o3_h512
#   sym_halfkp_256x2_512       halfkp_pair0_d256_o3_h512
#   sym_kp_256x2_o1_32_32      kp_pair0_d256_o1_h32_h232
#   sym_halfkp_256x2_o1_32_32  halfkp_pair0_d256_o1_h32_h232
#   sym_token_64x2_512         pair0_d64_o3_h512
#   sym_token_128x2_512        pair0_d128_o3_h512
#   sym_token_256x2_512        pair0_d256_o3_h512
#   sym_token_256x2_o1_32_32   pair0_d256_o1_h32_h232
#
# The token space is also the only one with a pair table, a second moment or a
# square field, and a shape that has one is spelled by what follows the
# dimensions: `_pair<N>` for the table's width, then `_lse<N>` for how many of
# its last channels read a log-sum-exp, `_ks` for the kept magnitudes, `_split`
# for power sums taken per owner, `_m<N>` for a second moment over `N` channels
# and `_f<N>` for a square field of `N` channels per square. The order is
# spelled `_o<N>` when it is not three, and a second dense width follows the
# first, both as in the names above.
#
#   feature                                  Manaka's shape code
#   sym_token_128x2_512_pair16               pair16_d128_o3_h512
#   sym_token_128x2_512_pair32               pair32_d128_o3_h512
#   sym_token_128x2_512_pair64               pair64_d128_o3_h512
#   sym_token_64x2_512_pair16                pair16_d64_o3_h512
#   sym_token_256x2_512_pair16               pair16_d256_o3_h512
#   sym_token_128x2_o2_512_pair16            pair16_d128_o2_h512
#   sym_token_128x2_o4_512_pair16            pair16_d128_o4_h512
#   sym_token_128x2_1024_pair16              pair16_d128_o3_h1024
#   sym_token_128x2_512_256_pair16           pair16_d128_o3_h512_h2256
#   sym_token_128x2_512_512_pair16           pair16_d128_o3_h512_h2512
#   sym_token_128x2_512_pair16_lse4          pair16_d128_o3_h512_lse4
#   sym_token_128x2_512_pair16_lse8          pair16_d128_o3_h512_lse8
#   sym_token_128x2_512_pair16_lse16         pair16_d128_o3_h512_lse16
#   sym_token_128x2_512_pair16_lse4_ks       pair16_d128_o3_h512_lse4_ks
#   sym_token_128x2_512_pair16_ks            pair16_d128_o3_h512_ks
#   sym_token_128x2_512_pair16_split         pair16_d128_o3_h512_split
#   sym_token_128x2_512_pair16_m16           pair16_d128_o3_h512_m16
#   sym_token_128x2_512_pair16_m32           pair16_d128_o3_h512_m32
#   sym_token_128x2_512_pair16_f2            pair16_d128_o3_h512_f2
#   sym_token_128x2_512_pair16_f4            pair16_d128_o3_h512_f4
#   sym_token_128x2_512_pair16_f8            pair16_d128_o3_h512_f8
#
# `pair16_d128_o3_h512_pair-tie` is `sym_token_128x2_512_pair16` too: tying the
# pair rows is a way of training, and the exporter writes the sum, so the file
# has the shape of an ordinary `pair16_d128_o3_h512` and nothing in it says tied.
#
# The dimensions of each are one row of the table in `src/manaka/shape.rs`.
sym_kp_64x2_512 = ["sym_kp"]
sym_halfkp_64x2_512 = ["sym_halfkp"]
sym_kp_128x2_512 = ["sym_kp"]
sym_halfkp_128x2_512 = ["sym_halfkp"]
sym_kp_256x2_512 = ["sym_kp"]
sym_halfkp_256x2_512 = ["sym_halfkp"]
sym_kp_256x2_o1_32_32 = ["sym_kp"]
sym_halfkp_256x2_o1_32_32 = ["sym_halfkp"]
sym_token_64x2_512 = ["sym_token"]
sym_token_128x2_512 = ["sym_token"]
sym_token_256x2_512 = ["sym_token"]
sym_token_256x2_o1_32_32 = ["sym_token"]
sym_token_128x2_512_pair16 = ["sym_token"]
sym_token_128x2_512_pair32 = ["sym_token"]
sym_token_128x2_512_pair64 = ["sym_token"]
sym_token_64x2_512_pair16 = ["sym_token"]
sym_token_256x2_512_pair16 = ["sym_token"]
sym_token_128x2_o2_512_pair16 = ["sym_token"]
sym_token_128x2_o4_512_pair16 = ["sym_token"]
sym_token_128x2_1024_pair16 = ["sym_token"]
sym_token_128x2_512_256_pair16 = ["sym_token"]
sym_token_128x2_512_512_pair16 = ["sym_token"]
sym_token_128x2_512_pair16_lse4 = ["sym_token"]
sym_token_128x2_512_pair16_lse8 = ["sym_token"]
sym_token_128x2_512_pair16_lse16 = ["sym_token"]
sym_token_128x2_512_pair16_lse4_ks = ["sym_token"]
sym_token_128x2_512_pair16_ks = ["sym_token"]
sym_token_128x2_512_pair16_split = ["sym_token"]
sym_token_128x2_512_pair16_m16 = ["sym_token"]
sym_token_128x2_512_pair16_m32 = ["sym_token"]
sym_token_128x2_512_pair16_f2 = ["sym_token"]
sym_token_128x2_512_pair16_f4 = ["sym_token"]
sym_token_128x2_512_pair16_f8 = ["sym_token"]
# The two hand-crafted evaluations (HCE), spelled the same way: how many
# coefficients, then how they are grouped. Material is 10 board slots and 7
# hand slots; Mobility is 107 board features and 57 for a piece in hand.
# Neither reads a file -- the coefficients are a generated source file compiled
# into the binary -- and neither shares anything with the network shapes: they
# count pieces and attacks straight off the `Position`, so `features.rs` and
# everything behind it is left out of the build. See `src/hce.rs`.
hce_material_17 = ["hce"]
hce_mobility_107_57 = ["hce"]
# Which fit of the HCE shape selected above, not a shape of its own. Off is the
# fit over the teacher as generated; on is the fit over the same teacher moved
# to its quiescence leaves (`qleap/Training_dataset_qsearched_by_NAGISA_V4`),
# where a position in the middle of an exchange no longer votes. Same lengths,
# same extraction, other numbers -- see the two `hce_weights_*_qs.rs` files.
# It qualifies a shape rather than being one, so the guard in `types.rs` leaves
# it out of every list: counting it would reject the builds it exists to
# describe.
hce_fit_qsearched = []

# Tools for putting a network beside the trainer's own evaluation of it (see
# `scripts/manaka_compare.py`). Each is built only for the shapes it can read:
# the networks are tens to hundreds of megabytes and live outside the repository,
# so these are not tests.
[[example]]
name = "sym_dump"
required-features = ["sym"]

[[example]]
name = "nnue_dump"
required-features = ["nnue_standard"]

[dev-dependencies]
proptest = "~1.11"
serde_json = "~1.0"
