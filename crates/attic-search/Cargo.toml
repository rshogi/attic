[package]
name = "attic-search"
version.workspace = true
edition.workspace = true
publish = false

# Search layer: may depend on Evaluation, Storage, and State, never on Protocol.
# It owns the transposition table, including widening and validating stored
# moves against a `Position`.
[dependencies]
attic-eval = { path = "../attic-eval", default-features = false }
attic-state = { path = "../attic-state", default-features = false }
attic-storage = { path = "../attic-storage" }

# Pass-through only; see `attic-state/Cargo.toml`. The search's own repetition
# handling is the `RepetitionState`-to-score mapping, identical either way.
[features]
default = ["quick-draw"]
quick-draw = ["attic-state/quick-draw", "attic-eval/quick-draw"]
# Network selection, passed through to attic-eval. Shapes that keep their
# layer-stack coefficients outside `nn.bin` also make the loader pick up the
# `progress.bin` beside it.
sfnn_halfkahm2_1536_15_32_k3k3 = ["attic-eval/sfnn_halfkahm2_1536_15_32_k3k3", "sfnn"]
sfnn_halfkahm2_1024_15_64_progress8kpabs = ["attic-eval/sfnn_halfkahm2_1024_15_64_progress8kpabs", "sfnn_progress"]
sfnn_halfkahm2_2304_15_64_progress8ek = ["attic-eval/sfnn_halfkahm2_2304_15_64_progress8ek", "sfnn_progress"]
nnue_kp_256x2_32_32 = ["attic-eval/nnue_kp_256x2_32_32"]
nnue_halfkp_256x2_32_32 = ["attic-eval/nnue_halfkp_256x2_32_32"]
nnue_halfkp_128x2_32_32 = ["attic-eval/nnue_halfkp_128x2_32_32"]
nnue_halfkp_768x2_16_64 = ["attic-eval/nnue_halfkp_768x2_16_64"]
sym_kp_128x2_512 = ["attic-eval/sym_kp_128x2_512"]
sym_halfkp_128x2_512 = ["attic-eval/sym_halfkp_128x2_512"]
# Internal, and the same names `attic-eval` uses for what they describe (a
# `cfg` cannot see another crate's features, so each crate keeps its own). Neither
# selects a network; a shape turns on the ones that describe it.
#   sfnn            every SFNN shape: HalfKA_hm2, a shortcut row in fc_0
#   sfnn_progress   ... whose stack comes from a `progress.bin` beside `nn.bin`
sfnn = []
sfnn_progress = ["sfnn"]
# Make `go nodes N` stop where the reference does: leave the `check_time` poll out
# of `qsearch` and start each `go` with `callsCnt` at 0. For comparing against
# YaneuraOu only; the default keeps the earlier abort latency.
ref_check_time = []

[dev-dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
