name: Integration

on:
  pull_request:
  push:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # `.cargo/config.toml` compiles for the host CPU (`-C target-cpu=native`),
  # which is right everywhere a binary runs on the machine that produced it.
  # These jobs are the one place that does not hold: `rust-cache` restores a
  # `target/` directory built on an earlier runner, the hosted runners are not
  # a single CPU model, and a native-built artifact dies with SIGILL on the
  # first instruction its new host lacks. An environment `RUSTFLAGS` overrides
  # the config file, and `rust-cache` folds `RUSTFLAGS` into its cache key, so
  # pinning a baseline every current x86-64 runner provides keeps the restored
  # artifacts runnable. Builds outside CI keep the native default.
  #
  # The pin also fixes which kernels these jobs cover: the AVX-512 forward pass
  # is selected by `cfg(target_feature = "avx512…")`, which x86-64-v3 does not
  # enable, so CI exercises the portable path. The AVX-512 kernels' own unit
  # tests enable their features per function and probe the CPU at run time, so
  # they still run on a runner that has the instructions.
  RUSTFLAGS: "-C target-cpu=x86-64-v3"
  # Tells the two tests that check the build matches its host (`active_backend`
  # in attic-eval) that this build deliberately does not: a runner with
  # AVX-512 VNNI is expected to run the scalar backend here. Without it those
  # tests fail on whichever runners happen to have that CPU.
  ATTIC_BASELINE_BUILD: "1"

# The network shape is a build-time feature and exactly one must be selected
# (`attic-eval` refuses to compile with none or two), so `--all-features` can
# neither build nor test anything. Each job below runs once per shape instead.
# `args` is what follows `cargo <verb>` to pick it; the thirtieth entry is the
# build that must match YaneuraOu node for node (`ref_check_time` moves the
# time checks to where the reference's are), which turns off the defaults.
# The list is written out in each job on purpose: it is the same thirty
# entries three times, and kept that way rather than behind a YAML anchor so that
# no workflow parser has to support one for CI to start at all.
#
# The Manaka shapes with a pair table are twenty-one, and only seven of them are
# rows here: each row builds the whole workspace and, in `test`, allocates a
# synthetic pair table of 175 MB (700 MB at `pair64`) several times over. The seven
# are one per axis the code branches on (the plain pair table, a log-sum-exp
# with kept magnitudes, `split`, a second hidden layer, order four, a second
# moment, a square field). The rest differ from them in a width or a count the
# code only reads as a constant, and `pair-shapes` below compiles and lints each
# of them.
#
# Nothing here has a network file: the tests that read one skip with a notice
# when it is absent, so a green run says the code builds and its self-contained
# tests pass, not that the shape evaluates correctly. Two groups are the
# exception. The `sym` shapes build a network in memory and run it against a
# forward pass written from the definition, and against its own file format
# (`manaka/tests.rs`), though never against a trained one. The two hce shapes
# read no file at all: `hce_golden` runs in full and holds their feature vectors
# to the reference engine's own. Their fit variant
# (`hce_fit_qsearched`) changes only the coefficients, which that test does not
# read, so it is not a row of its own.
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sfnn-1536
            args: --features sfnn_halfkahm2_1536_15_32_k3k3
          - name: sfnn-1024
            args: --features sfnn_halfkahm2_1024_15_64_progress8kpabs
          - name: sfnn-1024-ek
            args: --features sfnn_halfkahm2_1024_15_64_progress8ek
          - name: sfnn-2304
            args: --features sfnn_halfkahm2_2304_15_64_progress8ek
          - name: nnue-kp
            args: --features nnue_kp_256x2_32_32
          - name: nnue-halfkp
            args: --features nnue_halfkp_256x2_32_32
          - name: nnue-halfkp-128
            args: --features nnue_halfkp_128x2_32_32
          - name: nnue-halfkp-768
            args: --features nnue_halfkp_768x2_16_64
          - name: sym-kp-64
            args: --features sym_kp_64x2_512
          - name: sym-halfkp-64
            args: --features sym_halfkp_64x2_512
          - name: sym-kp
            args: --features sym_kp_128x2_512
          - name: sym-halfkp
            args: --features sym_halfkp_128x2_512
          - name: sym-kp-256
            args: --features sym_kp_256x2_512
          - name: sym-halfkp-256
            args: --features sym_halfkp_256x2_512
          - name: sym-kp-256-o1
            args: --features sym_kp_256x2_o1_32_32
          - name: sym-halfkp-256-o1
            args: --features sym_halfkp_256x2_o1_32_32
          - name: sym-token-64
            args: --features sym_token_64x2_512
          - name: sym-token
            args: --features sym_token_128x2_512
          - name: sym-token-256
            args: --features sym_token_256x2_512
          - name: sym-token-256-o1
            args: --features sym_token_256x2_o1_32_32
          - name: sym-token-pair16
            args: --features sym_token_128x2_512_pair16
          - name: sym-token-pair16-lse4-ks
            args: --features sym_token_128x2_512_pair16_lse4_ks
          - name: sym-token-pair16-split
            args: --features sym_token_128x2_512_pair16_split
          - name: sym-token-pair16-h2
            args: --features sym_token_128x2_512_256_pair16
          - name: sym-token-pair16-o4
            args: --features sym_token_128x2_o4_512_pair16
          - name: sym-token-pair16-m16
            args: --features sym_token_128x2_512_pair16_m16
          - name: sym-token-pair16-f4
            args: --features sym_token_128x2_512_pair16_f4
          - name: hce-material
            args: --features hce_material_17
          - name: hce-mobility
            args: --features hce_mobility_107_57
          - name: yaneuraou-parity
            args: --no-default-features --features nnue_kp_256x2_32_32,ref_check_time
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo clippy --workspace --all-targets ${{ matrix.args }} -- -D warnings
      # The job above pins x86-64-v3, so the AVX-512 arms of `simd` are never
      # compiled here, and a shape can pass it and fail to build on a machine
      # that has the instructions: that is what #23 fixed. This second pass
      # compiles for an AVX-512 target without running anything. `--target`
      # keeps `RUSTFLAGS` away from the build scripts and proc macros, which
      # are built for the host and would die with SIGILL on a runner without
      # AVX-512 if they were compiled with those features.
      - name: clippy against an AVX-512 target
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3 -C target-feature=+avx512f,+avx512bw,+avx512vnni,+avx512vl,+avx512dq
        run: |
          cargo clippy --workspace --all-targets --target x86_64-unknown-linux-gnu \
            ${{ matrix.args }} -- -D warnings

  # The fourteen pair-table shapes that are not rows of the matrices above. They
  # share every line of code with a row that is, and differ in a constant, so
  # what can go wrong with one is that it does not compile or trips a lint that
  # a constant being zero or one provokes (`lse16` has no mean channels at all):
  # one workspace-wide clippy pass per shape finds both. The dependencies build
  # once and every shape after the first recompiles only the workspace.
  pair-shapes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: pair-shapes
      - run: |
          for shape in \
            sym_token_128x2_512_pair32 \
            sym_token_128x2_512_pair64 \
            sym_token_64x2_512_pair16 \
            sym_token_256x2_512_pair16 \
            sym_token_128x2_o2_512_pair16 \
            sym_token_128x2_1024_pair16 \
            sym_token_128x2_512_512_pair16 \
            sym_token_128x2_512_pair16_lse4 \
            sym_token_128x2_512_pair16_lse8 \
            sym_token_128x2_512_pair16_lse16 \
            sym_token_128x2_512_pair16_ks \
            sym_token_128x2_512_pair16_m32 \
            sym_token_128x2_512_pair16_f2 \
            sym_token_128x2_512_pair16_f8; do
            echo "::group::$shape"
            cargo clippy --workspace --all-targets --features "$shape" -- -D warnings
            echo "::endgroup::"
          done

  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sfnn-1536
            args: --features sfnn_halfkahm2_1536_15_32_k3k3
          - name: sfnn-1024
            args: --features sfnn_halfkahm2_1024_15_64_progress8kpabs
          - name: sfnn-1024-ek
            args: --features sfnn_halfkahm2_1024_15_64_progress8ek
          - name: sfnn-2304
            args: --features sfnn_halfkahm2_2304_15_64_progress8ek
          - name: nnue-kp
            args: --features nnue_kp_256x2_32_32
          - name: nnue-halfkp
            args: --features nnue_halfkp_256x2_32_32
          - name: nnue-halfkp-128
            args: --features nnue_halfkp_128x2_32_32
          - name: nnue-halfkp-768
            args: --features nnue_halfkp_768x2_16_64
          - name: sym-kp-64
            args: --features sym_kp_64x2_512
          - name: sym-halfkp-64
            args: --features sym_halfkp_64x2_512
          - name: sym-kp
            args: --features sym_kp_128x2_512
          - name: sym-halfkp
            args: --features sym_halfkp_128x2_512
          - name: sym-kp-256
            args: --features sym_kp_256x2_512
          - name: sym-halfkp-256
            args: --features sym_halfkp_256x2_512
          - name: sym-kp-256-o1
            args: --features sym_kp_256x2_o1_32_32
          - name: sym-halfkp-256-o1
            args: --features sym_halfkp_256x2_o1_32_32
          - name: sym-token-64
            args: --features sym_token_64x2_512
          - name: sym-token
            args: --features sym_token_128x2_512
          - name: sym-token-256
            args: --features sym_token_256x2_512
          - name: sym-token-256-o1
            args: --features sym_token_256x2_o1_32_32
          - name: sym-token-pair16
            args: --features sym_token_128x2_512_pair16
          - name: sym-token-pair16-lse4-ks
            args: --features sym_token_128x2_512_pair16_lse4_ks
          - name: sym-token-pair16-split
            args: --features sym_token_128x2_512_pair16_split
          - name: sym-token-pair16-h2
            args: --features sym_token_128x2_512_256_pair16
          - name: sym-token-pair16-o4
            args: --features sym_token_128x2_o4_512_pair16
          - name: sym-token-pair16-m16
            args: --features sym_token_128x2_512_pair16_m16
          - name: sym-token-pair16-f4
            args: --features sym_token_128x2_512_pair16_f4
          - name: hce-material
            args: --features hce_material_17
          - name: hce-mobility
            args: --features hce_mobility_107_57
          - name: yaneuraou-parity
            args: --no-default-features --features nnue_kp_256x2_32_32,ref_check_time
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo build --release -p attic ${{ matrix.args }}

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sfnn-1536
            args: --features sfnn_halfkahm2_1536_15_32_k3k3
          - name: sfnn-1024
            args: --features sfnn_halfkahm2_1024_15_64_progress8kpabs
          - name: sfnn-1024-ek
            args: --features sfnn_halfkahm2_1024_15_64_progress8ek
          - name: sfnn-2304
            args: --features sfnn_halfkahm2_2304_15_64_progress8ek
          - name: nnue-kp
            args: --features nnue_kp_256x2_32_32
          - name: nnue-halfkp
            args: --features nnue_halfkp_256x2_32_32
          - name: nnue-halfkp-128
            args: --features nnue_halfkp_128x2_32_32
          - name: nnue-halfkp-768
            args: --features nnue_halfkp_768x2_16_64
          - name: sym-kp-64
            args: --features sym_kp_64x2_512
          - name: sym-halfkp-64
            args: --features sym_halfkp_64x2_512
          - name: sym-kp
            args: --features sym_kp_128x2_512
          - name: sym-halfkp
            args: --features sym_halfkp_128x2_512
          - name: sym-kp-256
            args: --features sym_kp_256x2_512
          - name: sym-halfkp-256
            args: --features sym_halfkp_256x2_512
          - name: sym-kp-256-o1
            args: --features sym_kp_256x2_o1_32_32
          - name: sym-halfkp-256-o1
            args: --features sym_halfkp_256x2_o1_32_32
          - name: sym-token-64
            args: --features sym_token_64x2_512
          - name: sym-token
            args: --features sym_token_128x2_512
          - name: sym-token-256
            args: --features sym_token_256x2_512
          - name: sym-token-256-o1
            args: --features sym_token_256x2_o1_32_32
          - name: sym-token-pair16
            args: --features sym_token_128x2_512_pair16
          - name: sym-token-pair16-lse4-ks
            args: --features sym_token_128x2_512_pair16_lse4_ks
          - name: sym-token-pair16-split
            args: --features sym_token_128x2_512_pair16_split
          - name: sym-token-pair16-h2
            args: --features sym_token_128x2_512_256_pair16
          - name: sym-token-pair16-o4
            args: --features sym_token_128x2_o4_512_pair16
          - name: sym-token-pair16-m16
            args: --features sym_token_128x2_512_pair16_m16
          - name: sym-token-pair16-f4
            args: --features sym_token_128x2_512_pair16_f4
          - name: hce-material
            args: --features hce_material_17
          - name: hce-mobility
            args: --features hce_mobility_107_57
          - name: yaneuraou-parity
            args: --no-default-features --features nnue_kp_256x2_32_32,ref_check_time
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --workspace ${{ matrix.args }}
